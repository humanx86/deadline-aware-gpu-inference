name: Publish research book

on:
  push:
    branches: [main]
    paths:
      - "wiki-research-book/**"
      - ".github/workflows/publish-wiki-research-book.yml"
  pull_request:
    branches: [main]
    paths:
      - "wiki-research-book/**"
      - ".github/workflows/publish-wiki-research-book.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: "1.10.20"

      - name: Render research book
        run: quarto render wiki-research-book --to html --no-execute

      - name: Check required output
        shell: bash
        run: |
          test -s wiki-research-book/_book/index.html
          test -s wiki-research-book/_book/experiments/r0a-pilot.html
          test -s wiki-research-book/_book/methods/measurement-methodology.html
          test -s wiki-research-book/_book/diagrams/pilot-arms.svg
          test -s wiki-research-book/_book/diagrams/pilot-arms.excalidraw

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: wiki-research-book/_book

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy book
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
