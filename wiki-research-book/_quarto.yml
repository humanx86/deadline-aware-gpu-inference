project:
  type: book
  output-dir: _book
  resources:
    - diagrams/*.svg
    - diagrams/*.excalidraw

book:
  title: "Two Clocks"
  subtitle: "Research Book · Shared-GPU Inference"
  description: "Research on interference between latency-critical perception and vision-language model serving: deadlines, freshness, and useful throughput."
  chapters:
    - index.qmd
    - experiments/r0a-pilot.qmd
    - methods/measurement-methodology.qmd
    - references.qmd
  search: true
  page-navigation: true

bibliography: references.bib
lang: en

execute:
  eval: false

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 2
    code-copy: true
    link-external-newwindow: true
    number-sections: false
